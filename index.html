<script>
let packing = { columns: [], rows: [], history: [] };
let users = { users: [] };
let packWidths = [];
let histWidths = [];
const BLANK = "__BLANK__";
const BLANK_LABEL = "<空白>";
const HISTORY_COLS = [
  { key: "at", label: "变更时间" },
  { key: "action", label: "动作" },
  { key: "invoice", label: "发票号" },
  { key: "po", label: "PO" },
  { key: "ho", label: "HO" },
  { key: "supplier", label: "供应商" },
  { key: "fieldLabel", label: "变更字段" },
  { key: "oldValue", label: "原值" },
  { key: "newValue", label: "新值" },
];
const USER_COLS = [
  { key: "name", label: "供应商" },
  { key: "username", label: "用户名" },
  { key: "password", label: "密码" },
  { key: "createdBy", label: "创建人" },
  { key: "createdAt", label: "创建时间" },
  { key: "updatedBy", label: "修改人" },
  { key: "updatedAt", label: "修改时间" },
];
let userWidths = [88, 280, 100, 100, 88, 150, 88, 150];
let view = "pack";
let currentUser = { username: "", name: "", isAdmin: false };
const SESSION_KEY = "invoice.session";
const IDLE_MS = 30 * 60 * 1000;
let idleTimer = null;
let idleBound = false;
function isAdminUser(name) { return String(name || "").trim().toUpperCase() === "ADMIN"; }
function clearSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function saveSession(username, password) {
  const rec = { username, password: String(password || "").trim(), last: Date.now() };
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(rec)); } catch (e) {}
}
function readSession() {
  let rec = null;
  try { rec = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch (e) {}
  if (!rec || !rec.username) return null;
  if (rec.last && Date.now() - rec.last > IDLE_MS) {
    clearSession();
    return null;
  }
  return rec;
}
function touchSession() {
  const rec = readSession();
  if (!rec) return;
  rec.last = Date.now();
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(rec)); } catch (e) {}
  resetIdleTimer();
}
function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    clearSession();
    location.reload();
  }, IDLE_MS);
}
let modalKind = "";
let modalIndex = -1;
let filters = {};
let page = 1;
let pageSize = 100;
const PAGE_SIZES = [50, 100, 500, 10000];
function valOf(row, key) { return row[key] == null ? "" : String(row[key]); }
function packCols() {
  return (packing.columns || []).filter(c => c.key !== "viewers" && c.label !== "可见用户" && c.key !== "shipHis" && c.label !== "发货单号记录" && c.key !== "supplierName" && c.label !== "供应商名称" && c.key !== "gicode" && c.label !== "装箱单明细内码");
}
function scopedPackRows() {
  if (currentUser.isAdmin) return packing.rows || [];
  return (packing.rows || []).filter(r => rowVisibleTo(r, currentUser.username, packing.columns));
}
const DROPDOWN_LABELS = ["国家", "供应商", "业务员", "跟单员", "数量类型", "装箱类型", "品牌", "动作", "变更字段"];
let packSelected = new Set();
function scopedHistoryRows() {
  const rows = packing.history || [];
  if (currentUser.isAdmin) return rows;
  return rows.filter(r => rowVisibleTo(r, currentUser.username, [{ key: "supplier", label: "供应商" }]));
}
function sourceRowsForFilters() {
  if (view === "users") return users.users || [];
  if (view === "history") return scopedHistoryRows();
  return scopedPackRows();
}
function distinctOptions(col) {
  const key = col.key === "u_name" ? "name" : col.key;
  const set = new Set();
  sourceRowsForFilters().forEach(r => {
    const v = String(r[key] == null ? "" : r[key]).trim();
    if (v) set.add(v);
  });
  return [...set].sort((a, b) => a.localeCompare(b, "zh"));
}
function isDropdownCol(col) {
  return DROPDOWN_LABELS.includes(col.label);
}
let ctxInfo = null;
let colFilterSel = new Set();
let headerFilterOn = false;
function currentViewCols() {
  if (view === "users") return USER_COLS;
  if (view === "history") return HISTORY_COLS;
  return packCols();
}
function currentViewRows() {
  if (view === "users") return users.users || [];
  if (view === "history") return scopedHistoryRows();
  return scopedPackRows();
}
function isBlankValue(v) {
  return !String(v == null ? "" : v).trim();
}
function filterToken(v) {
  return isBlankValue(v) ? BLANK : String(v);
}
function matchFilters(row, cols) {
  return cols.every(col => {
    const v = valOf(row, col.key);
    const picked = filters["__in_" + col.key];
    if (Array.isArray(picked) && picked.length) {
      if (!picked.includes(filterToken(v))) return false;
    }
    const q = (filters[col.key] || "").trim();
    if (!q) return true;
    if (q === BLANK) return isBlankValue(v);
    const tokens = q.split(/[,，;；]+/).map(x => x.trim()).filter(Boolean);
    if (!tokens.length) return true;
    const low = v.toLowerCase();
    return tokens.some(t => low.includes(t.toLowerCase()));
  });
}
function filteredPackList() {
  return scopedPackRows().filter(row => matchFilters(row, packCols()));
}
function filteredHistory() {
  return scopedHistoryRows().filter(row => matchFilters(row, HISTORY_COLS));
}
function filteredRows() {
  if (view === "history") return filteredHistory();
  return filteredPackList();
}
function filterCols() {
  if (view === "history") {
    const allow = ["发票号", "PO", "HO", "供应商", "动作", "变更字段"];
    return HISTORY_COLS.filter(c => allow.includes(c.label));
  }
  const allow = ["发票号", "装箱号", "PO", "HO", "数量类型", "装箱类型", "品牌", "供应商", "国家"];
  return packCols().filter(c => allow.includes(c.label));
}
function filteredUsers() {
  const qName = (filters.u_name || "").trim().toLowerCase();
  const qUser = (filters.u_username || "").trim().toLowerCase();
  return (users.users || []).filter(u => {
    if (qName && !String(u.name || "").toLowerCase().includes(qName)) return false;
    if (qUser && !String(u.username || "").toLowerCase().includes(qUser)) return false;
    return true;
  });
}
function filterControl(col) {
  const val = filters[col.key] || "";
  if (isDropdownCol(col)) {
    const opts = distinctOptions(col);
    return `<div class="item combo"><label>${esc(col.label)}</label>
      <div class="combo-box" data-key="${col.key}">
        <input data-key="${col.key}" placeholder="多个用逗号" value="${esc(val)}" autocomplete="off" />
        <div class="combo-list" hidden>${opts.map(o => `<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      </div>
    </div>`;
  }
  return `<div class="item"><label>${esc(col.label)}</label>
    <input data-key="${col.key}" placeholder="多个用逗号" value="${esc(val)}" />
  </div>`;
}
function bindCombos(root) {
  root.querySelectorAll(".combo-box").forEach(box => {
    const inp = box.querySelector("input");
    const list = box.querySelector(".combo-list");
    const buttons = () => [...list.querySelectorAll("button")];
    const show = () => {
      const kw = inp.value.trim().toLowerCase();
      let n = 0;
      buttons().forEach(btn => {
        const hit = !kw || btn.dataset.v.toLowerCase().includes(kw);
        btn.hidden = !hit;
        if (hit) n++;
      });
      list.hidden = n === 0;
    };
    inp.addEventListener("focus", show);
    inp.addEventListener("input", show);
    inp.addEventListener("keydown", e => {
      if (e.key === "Escape") { list.hidden = true; return; }
      if (e.key === "Enter") {
        const first = buttons().find(b => !b.hidden);
        if (first && inp.value.trim() && first.dataset.v.toLowerCase().includes(inp.value.trim().toLowerCase())) {
          if (inp.value.trim().toLowerCase() !== first.dataset.v.toLowerCase()) inp.value = first.dataset.v;
        }
      }
    });
    list.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("mousedown", e => e.preventDefault());
      btn.addEventListener("click", () => {
        inp.value = btn.dataset.v;
        filters[inp.dataset.key] = btn.dataset.v;
        list.hidden = true;
      });
    });
  });
  document.addEventListener("click", e => {
    root.querySelectorAll(".combo-box").forEach(box => {
      if (!box.contains(e.target)) box.querySelector(".combo-list").hidden = true;
    });
  });
}
function renderFilters() {
  const el = document.getElementById("filters");
  const act = document.getElementById("filterActions");
  if (view === "users") {
    el.innerHTML = filterControl({ key: "u_name", label: "供应商" }) +
      `<div class="item"><label>用户名</label><input data-key="u_username" placeholder="请输入" value="${esc(filters.u_username || "")}" /></div>`;
  } else {
    el.innerHTML = filterCols().map(col => filterControl(col)).join("");
  }
  act.innerHTML = `
    <button type="button" class="btn" id="btnQuery">查询</button>
    <button type="button" class="btn btn-plain" id="btnReset">重置</button>
    <button type="button" class="btn btn-plain" id="btnReload2">刷新</button>
  `;
  el.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") runQuery(); });
  });
  bindCombos(el);
  document.getElementById("btnQuery").onclick = runQuery;
  document.getElementById("btnReset").onclick = () => {
    filters = {};
    page = 1;
    renderFilters();
    refreshCurrentView();
  };
  document.getElementById("btnReload2").onclick = () => {
    if (typeof reloadView === "function") reloadView();
    else location.reload();
  };
}
function runQuery() {
  document.querySelectorAll("#filters input, #filters select").forEach(inp => {
    filters[inp.dataset.key] = inp.value;
  });
  page = 1;
  refreshCurrentView();
}
function fillPager(elId, total) {
  const el = document.getElementById(elId);
  if (!el) return;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (page > pages) page = pages;
  const start = total ? (page - 1) * pageSize + 1 : 0;
  const end = Math.min(total, page * pageSize);
  const opts = PAGE_SIZES.map(n => `<option value="${n}" ${n===pageSize?"selected":""}>${n}条/页</option>`).join("");
  el.innerHTML = `
    <span>
      <select class="pageSize">${opts}</select>
      共 ${total} 条
    </span>
    <span>
      <button class="pg" data-p="prev" ${page<=1?"disabled":""}>‹</button>
      ${pageButtons(page, pages)}
      <button class="pg" data-p="next" ${page>=pages?"disabled":""}>›</button>
      第 ${start}-${end} 条 / 共 ${total} 条
    </span>
  `;
  el.querySelector(".pageSize").onchange = (e) => {
    pageSize = Number(e.target.value) || 100;
    page = 1;
    redrawCurrentView();
  };
  el.querySelectorAll(".pg").forEach(btn => {
    btn.onclick = () => {
      if (btn.disabled) return;
      if (btn.dataset.p === "prev") page = Math.max(1, page - 1);
      else if (btn.dataset.p === "next") page = Math.min(pages, page + 1);
      else if (btn.dataset.n) page = Number(btn.dataset.n);
      redrawCurrentView();
    };
  });
}
function isOfficialQty(row) {
  return String(row.qtyType || "").trim() === "正式";
}
function renderPack() {
  const cols = packCols();
  const table = document.querySelector("#panelPack table");
  if (!packWidths.length || packWidths.length !== cols.length + 2) {
    packWidths = [36, 48, ...cols.map(c => defaultWidth(c.label))];
  }
  applyColgroup(table, packWidths);
  const rows = filteredPackList();
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (page > pages) page = pages;
  const start = (page - 1) * pageSize;
  const slice = rows.slice(start, start + pageSize);
  document.getElementById("phead").innerHTML = "<tr>" +
    `<th data-lock="1"><input type="checkbox" class="chk" id="packCheckAll" /></th>` +
    `<th data-lock="1">#</th>` +
    cols.map(c => thHtml(c)).join("") + "</tr>";
  const empty = document.getElementById("pempty");
  if (!rows.length) {
    document.getElementById("pbody").innerHTML = "";
    empty.hidden = false;
  } else {
    empty.hidden = true;
    document.getElementById("pbody").innerHTML = slice.map((row, i) => {
      const n = start + i + 1;
      const id = row.id || ("idx-" + n);
      const checked = packSelected.has(id) ? "checked" : "";
      return "<tr>" +
        `<td class="num"><input type="checkbox" class="chk pack-chk" data-id="${esc(id)}" ${checked} /></td>` +
        `<td class="num">${n}</td>` +
        cols.map(c => `<td title="${esc(row[c.key])}">${esc(row[c.key])}</td>`).join("") +
        "</tr>";
    }).join("");
  }
  enableResize(table, packWidths);
  enableReorder(table, (from, to) => {
    if (from < 2 || to < 2) return;
    packing.columns = moveItem(packCols(), from - 2, to - 2);
    packWidths = moveItem(packWidths, from, to);
    renderPack();
  });
  fillPager("ppager", rows.length);
  bindColFilterBtns(table, cols);
  bindTableContext("#panelPack table", packCols());
  document.querySelectorAll(".pack-chk").forEach(chk => {
    chk.onchange = () => {
      const id = chk.dataset.id;
      if (chk.checked) packSelected.add(id);
      else packSelected.delete(id);
      syncPackCheckAll(rows);
    };
  });
  const all = document.getElementById("packCheckAll");
  if (all) {
    all.onchange = () => {
      if (all.checked) rows.forEach(r => packSelected.add(r.id));
      else rows.forEach(r => packSelected.delete(r.id));
      renderPack();
    };
    syncPackCheckAll(rows);
  }
  const t = packing.fetchedAt || "";
  const el = document.getElementById("packTime");
  if (el) el.textContent = t ? "数据更新时间：" + t : "";
}
function syncPackCheckAll(rows) {
  const all = document.getElementById("packCheckAll");
  if (!all) return;
  const list = rows || filteredPackList();
  const n = list.filter(r => packSelected.has(r.id)).length;
  all.checked = list.length > 0 && n === list.length;
  all.indeterminate = n > 0 && n < list.length;
}
function numVal(v) {
  const s = String(v == null ? "" : v).trim();
  if (!s || s === "-" ) return "";
  const n = Number(s.replace(/,/g, ""));
  return Number.isFinite(n) ? n : s;
}
function cloneCellStyle(from, to) {
  if (!from || !to) return;
  to.style = Object.assign({}, from.style || {});
  if (from.font) to.font = Object.assign({}, from.font);
  if (from.alignment) to.alignment = Object.assign({}, from.alignment);
  if (from.border) to.border = JSON.parse(JSON.stringify(from.border));
  if (from.fill) to.fill = JSON.parse(JSON.stringify(from.fill));
  if (from.numFmt) to.numFmt = from.numFmt;
}
function insertRowsBeforeTotals(ws, atRow, extra) {
  if (!extra) return;
  const merges = ws._merges || {};
  const moved = [];
  Object.keys(merges).forEach(key => {
    const m = (merges[key] && merges[key].model) || merges[key];
    if (!m || m.top < atRow) return;
    moved.push({ top: m.top, left: m.left, bottom: m.bottom, right: m.right });
  });
  moved.forEach(m => {
    ws.unMergeCells(m.top, m.left, m.bottom, m.right);
  });
  const blanks = [];
  for (let i = 0; i < extra; i++) blanks.push([]);
  ws.spliceRows(atRow, 0, ...blanks);
  moved.forEach(m => {
    ws.mergeCells(m.top + extra, m.left, m.bottom + extra, m.right);
  });
}
function templateCountry(v) {
  const s = String(v || "").trim();
  if (!s) return "";
  const key = s.split("-")[0].trim().toUpperCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "");
  const drop = {
    ARGENTINA: "ARGENTINA - 阿根廷",
    MEXICO: "MEXICO - 墨西哥",
    CHILE: "CHILE - 智利",
    PERU: "PERÚ - 秘鲁",
    BRAZIL: "BRAZIL - 巴西",
    PARAGUAY: "PARAGUAY - 巴拉圭",
    GUATEMALA: "GUATEMALA - 危地马拉",
    ELSALVADOR: "EL SALVADOR - 萨尔瓦多",
    URUGUAY: "URUGUAY - 乌拉圭",
    ESPANA: "ESPAÑA - 西班牙",
    SPAIN: "ESPAÑA - 西班牙",
    BOLIVIA: "BOLIVIA - 玻利维亚",
  };
  if (drop[key]) return drop[key];
  const hit = Object.keys(drop).find(k => key.includes(k) || k.includes(key));
  return hit ? drop[hit] : s;
}
async function exportPackLabels() {
  const list = filteredPackList();
  const picked = [];
  const bad = [];
  list.forEach((row, i) => {
    if (!packSelected.has(row.id)) return;
    const n = i + 1;
    if (!isOfficialQty(row)) bad.push("第" + n + "行【数量类型】为“" + (row.qtyType || "空") + "”，不允许导出");
    else picked.push(row);
  });
  if (bad.length) { ask(bad.join("；")); return; }

  if (countries.length > 1) {
    ask("勾选的明细包含多个国家，请按同一国家导出");
    return;
  }
  const JsPDF = window.jspdf && window.jspdf.jsPDF;
  if (!JsPDF) {
    ask("PDF 组件未加载，请刷新后再试");
    return;
  }
  try {
    const labels = expandCartonLabels(picked);
    if (!labels.length) { ask("没有可展开的箱数（Quantity Cartons 需大于 0）"); return; }
    labels.forEach(b => { b.boxTotal = labels.length; });
    const inv = picked.map(r => String(r.invoice || "").trim()).find(Boolean) || "";
    const meta = countryMetaOf(countries[0] || picked[0].country);
    const brandCode = brandCodeOf(picked.map(r => r.brand).find(Boolean) || "");
    const MAX = 400;
    const nChunks = Math.ceil(labels.length / MAX);
    for (let chunk = 0; chunk < nChunks; chunk++) {
      const start = chunk * MAX;
      const end = Math.min(start + MAX, labels.length);
      const doc = new JsPDF({ unit: "mm", format: [100, 100], orientation: "portrait" });
      for (let i = start; i < end; i++) {
        if (i > start) doc.addPage([100, 100], "portrait");
        const lab = labels[i];
        const qr = await genQrImg(lab.qr);
        const barcodeText = (meta.n ? meta.n + " - " : "") + (inv || "") + " - " + lab.cartonNumber + "/" + labels.length;
        const bar = genBarcodeImg(barcodeText);
        drawGuestLabel(doc, lab, meta, inv, brandCode, qr, bar);
      }
      const suffix = nChunks > 1 ? ("_parte" + (chunk + 1) + "de" + nChunks) : "";
      const shipNo = inv || picked.map(r => String(r.shipHis || "").trim().split(/\s+/)[0]).find(Boolean) || "A71";
      doc.save("Etiquetas_General_" + shipNo + "_" + labels.length + "cajas" + suffix + ".pdf");
    }
  } catch (e) {
    ask(e.message || "导出 PDF 失败");
  }
}

function bindTableContext(sel, cols) {
  const table = document.querySelector(sel);
  if (!table) return;
  table.oncontextmenu = (e) => {
    const td = e.target.closest("td,th");
    if (!td) return;
    e.preventDefault();
    const cell = td.closest("td");

    let colIndex = -1;
    if (cell) colIndex = [...tr.children].indexOf(cell);
    else if (th) colIndex = [...th.parentNode.children].indexOf(th);
    const lockCount = [...table.querySelectorAll("thead th[data-lock]")].length;
    const dataIndex = colIndex - lockCount;
    const col = dataIndex >= 0 ? cols[dataIndex] : null;
    const value = cell ? cell.getAttribute("title") || cell.textContent : "";
    ctxInfo = { col, value, x: e.clientX, y: e.clientY };

function openColFilter() {
  if (!ctxInfo || !ctxInfo.col) return;
  const col = ctxInfo.col;
  const rows = currentViewRows();
  const hasBlank = rows.some(r => isBlankValue(valOf(r, col.key)));
  const values = [...new Set(rows.map(r => valOf(r, col.key)).filter(v => String(v).trim() !== ""))].sort((a, b) => a.localeCompare(b, "zh"));
  const all = hasBlank ? [BLANK, ...values] : values;
  const prev = filters["__in_" + col.key];
  colFilterSel = new Set(Array.isArray(prev) && prev.length ? prev : all);
  const box = document.getElementById("colFilter");
  const list = document.getElementById("colFilterList");
  const q = document.getElementById("colFilterQ");
  const allBox = document.getElementById("colFilterAll");
  q.value = "";
  const syncAll = () => { allBox.checked = all.length > 0 && all.every(v => colFilterSel.has(v)); };
  const draw = () => {
    const kw = q.value.trim().toLowerCase();
    list.innerHTML = all.filter(v => {
      if (v === BLANK) return !kw || BLANK_LABEL.toLowerCase().includes(kw) || "空白".includes(kw);
      return !kw || v.toLowerCase().includes(kw);
    }).map(v =>
      `<label><input type="checkbox" value="${esc(v)}" ${colFilterSel.has(v) ? "checked" : ""}/>${esc(v === BLANK ? BLANK_LABEL : v)}</label>`
    ).join("");
    list.querySelectorAll("input").forEach(inp => {
      inp.onchange = () => {
        if (inp.checked) colFilterSel.add(inp.value);
        else colFilterSel.delete(inp.value);
        syncAll();
      };
    });
    syncAll();
  };
  allBox.onchange = () => {
    if (allBox.checked) all.forEach(v => colFilterSel.add(v));
    else colFilterSel.clear();
    draw();
  };
  q.oninput = draw;
  draw();
  box.hidden = false;
  box.style.left = Math.min(ctxInfo.x, window.innerWidth - 280) + "px";
  box.style.top = Math.min(ctxInfo.y, window.innerHeight - 360) + "px";
}

async function updatePackingNow() {
  if (!currentUser.isAdmin) return;
  const btn = document.getElementById("btnUpdatePack");
  if (btn) { btn.disabled = true; btn.textContent = "更新中…"; }
  show("正在拉取装箱明细，请稍候");

    let pingOk = false;
    try {
      const ping = await fetch(LOCAL_API + "/api/ping", { cache: "no-store" });
      pingOk = ping.ok;
    } catch (e) { pingOk = false; }
    if (!pingOk) {
      ask("本机更新服务还没起来。请先打开 Alpha Code，等开机自动启动完成后再点。");
      return;
    }
    const r = await fetch(LOCAL_API + "/api/update-packing", { method: "POST" });
    const text = await r.text();
    let info = null;
    try { info = JSON.parse(text); } catch (e) {}
    if (!r.ok || !info || !info.ok) {
      const msg = (info && info.error) || "更新失败";
      ask(msg);
      return;
    }
    const packFile = await loadUserPack(currentUser.username);
    const rec = readSession();
    const payload = await unlockPack(packFile, rec && rec.password ? rec.password : document.getElementById("loginPass").value);
    packing.columns = payload.packingColumns || packing.columns || [];
    packing.rows = payload.packingRows || packing.rows || [];
    packing.fetchedAt = info.fetchedAt || payload.packingFetchedAt || packing.fetchedAt || "";
    packing.history = payload.packingHistory || packing.history || [];
    if (payload.users) users = { users: payload.users };
    page = 1;
    renderFilters();
    redrawCurrentView();
    let tip = "已更新：装箱 " + (info.merged || 0) + " 行，历史新增 " + (info.newLogs || 0) + " 条";
    if (info.published === "pushed") tip += "，已发布到网站";
    else if (info.published === "no-change") tip += "，网站数据无变化";
    show(tip);
    if (info.publishError) ask("本机已更新，但发布网站失败：" + info.publishError);
  } catch (e) {
    ask((e && e.message) ? e.message : "更新失败");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "更新数据"; }
    setTimeout(() => { document.getElementById("msg").style.display = "none"; }, 4000);
  }
}

      document.getElementById("app").style.display = "none";
    }
    err.textContent = e.message || "登录失败";
  } finally {
    btn.disabled = false;
    btn.textContent = prev || "登录";
  }
}
window.doLogin = () => tryLogin(false);
document.getElementById("btnLogin").onclick = () => tryLogin(false);
document.getElementById("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(false); });
document.getElementById("loginUser").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(false); });
function restoreSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  try {
    const saved = readSession();
    if (!saved || !saved.username) return;
    document.getElementById("loginUser").value = saved.username;
    document.getElementById("loginPass").value = saved.password || "";
    tryLogin(true);
  } catch (e) {}
}
function normalizeUsers(u) {
  const list = (u && u.users) || [];
  return {
    users: list.map(x => {
      const username = String(x.username || "").trim().toUpperCase();
      return {
        username,
        name: x.name || "",
        password: String(x.password || "").trim(),
        createdBy: x.createdBy || username,
        createdAt: x.createdAt || "",
        updatedBy: x.updatedBy || username,
        updatedAt: x.updatedAt || "",
      };
    }),
  };
}
try { localStorage.removeItem("invoice.data"); } catch (e) {}
restoreSession();
