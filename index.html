<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>发票号查询 · 维护</title>
<link rel="stylesheet" href="srm.css?v=20261026x" />
</head>
<body>
<div class="login-wrap" id="loginBox">
  <div class="login-card">
    <div class="login-hd">发票号查询</div>
    <div class="login-bd">
      <div class="item"><label>用户名</label><input id="loginUser" autocomplete="username" /></div>
      <div class="item"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" /></div>
      <div class="err" id="loginErr"></div>
      <button type="button" class="btn" id="btnLogin" style="width:100%">登录</button>
    </div>
  </div>
</div>
<div class="shell" id="app" style="display:none">
  <aside class="sidebar">
    <div class="logo"><span>发</span>发票号查询</div>
    <nav class="menu">
      <a href="javascript:void(0)" id="navUsers">账号管控</a>
      <a href="javascript:void(0)" id="navData">业务数据</a>
      <a href="javascript:void(0)" id="navPack">装箱明细</a>
      <a href="javascript:void(0)" class="active" id="navQuery">数据查询</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">查询 / 数据查询</div>
      <div class="user" id="who"></div>
    </header>
    <div class="content">
      <div class="card">
        <form class="filters" id="filters" onsubmit="return false;"></form>
        <div class="actions" id="filterActions"></div>
        <div class="filters" style="gap:8px;justify-content:flex-start" id="toolbar"></div>
        <div class="okmsg" id="msg"></div>
      </div>
      <div class="card table-card" id="panelUsers" style="display:none">
        <div class="tabs"><span class="on">账号管控</span></div>
        <div class="table-wrap">
          <table>
            <thead id="userHead"></thead>
            <tbody id="userBody"></tbody>
          </table>
        </div>
        <div class="pager" id="userPager"></div>
      </div>
      <div class="card table-card" id="panelData">
        <div class="tabs"><span class="on">业务数据</span></div>
        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
      <div class="card table-card" id="panelPack" style="display:none">
        <div class="tabs"><span class="on">装箱明细</span><span class="pack-time" id="packTime"></span></div>
        <div class="table-wrap">
          <table>
            <thead id="phead"></thead>
            <tbody id="pbody"></tbody>
          </table>
          <div class="empty" id="pempty" hidden>暂无数据</div>
        </div>
        <div class="pager" id="ppager"></div>
      </div>
      <div class="card table-card" id="panelQuery" style="display:none">
        <div class="tabs"><span class="on">查询结果</span></div>
        <div class="table-wrap">
          <table>
            <thead id="qhead"></thead>
            <tbody id="qbody"></tbody>
          </table>
          <div class="empty" id="qempty" hidden>暂无数据</div>
        </div>
        <div class="pager" id="qpager"></div>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="modal">
  <div class="box">
    <div class="hd"><span id="modalTitle">编辑</span><button type="button" class="x" id="modalX">×</button></div>
    <div class="form" id="modalForm"></div>
    <div class="ft">
      <button type="button" class="btn" id="modalOk">保存</button>
      <button type="button" class="btn btn-plain" id="modalCancel">取消</button>
    </div>
  </div>
</div>
<div class="ctx-menu" id="ctxMenu" hidden>
  <button type="button" data-act="filter">筛选</button>
  <button type="button" data-act="clear">取消筛选</button>
  <button type="button" data-act="reload">刷新</button>
  <button type="button" data-act="export">导出</button>
</div>
<div class="col-filter" id="colFilter" hidden>
  <label class="all"><input type="checkbox" id="colFilterAll" checked /> 所有</label>
  <div class="search-row"><span>搜索:</span><input id="colFilterQ" /></div>
  <div class="list" id="colFilterList"></div>
  <div class="ft">
    <button type="button" class="btn" id="colFilterOk">确定</button>
    <button type="button" class="btn btn-plain" id="colFilterCancel">关闭</button>
  </div>
</div>
<div class="modal" id="dlg">
  <div class="box" style="width:min(420px,92vw)">
    <div class="hd"><span>提示</span><button type="button" class="x" id="dlgX">×</button></div>
    <div class="bd">
      <span class="qmark">?</span>
      <div id="dlgText"></div>
    </div>
    <div class="ft">
      <button type="button" class="btn" id="dlgOk">确定</button>
      <button type="button" class="btn btn-plain" id="dlgCancel">放弃</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="crypto-lib.js?v=20261026x"></script>
<script src="grid.js?v=20261026x"></script>
<script>
let data = { columns: [], rows: [] };
let packing = { columns: [], rows: [] };
let users = { users: [] };
let dataWidths = [];
let packWidths = [];
const USER_COLS = [
  { key: "name", label: "供应商" },
  { key: "username", label: "用户名" },
  { key: "password", label: "密码" },
  { key: "createdBy", label: "创建人" },
  { key: "createdAt", label: "创建时间" },
  { key: "updatedBy", label: "修改人" },
  { key: "updatedAt", label: "修改时间" },
];
let userWidths = [88, 280, 100, 100, 88, 150, 88, 150];
let view = "query";
let currentUser = { username: "", name: "", isAdmin: false };
let queryWidths = [];
const SESSION_KEY = "invoice.session";
const IDLE_MS = 30 * 60 * 1000;
let idleTimer = null;
let idleBound = false;
function isAdminUser(name) { return String(name || "").trim().toUpperCase() === "ADMIN"; }
function clearSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function saveSession(username, password) {
  const rec = { username, password: String(password || "").toUpperCase(), last: Date.now() };
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(rec)); } catch (e) {}
}
function readSession() {
  let rec = null;
  try { rec = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch (e) {}
  if (!rec || !rec.username) return null;
  if (rec.last && Date.now() - rec.last > IDLE_MS) {
    clearSession();
    return null;
  }
  return rec;
}
function touchSession() {
  const rec = readSession();
  if (!rec) return;
  rec.last = Date.now();
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(rec)); } catch (e) {}
  resetIdleTimer();
}
function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    clearSession();
    location.reload();
  }, IDLE_MS);
}
let modalKind = "";
let modalIndex = -1;
let filters = {};
let page = 1;
let pageSize = 100;
const PAGE_SIZES = [50, 100, 500, 10000];
function valOf(row, key) { return row[key] == null ? "" : String(row[key]); }
function scopedRows() {
  if (currentUser.isAdmin) return data.rows;
  return data.rows.filter(r => rowVisibleTo(r, currentUser.username, data.columns));
}
function packCols() {
  return (packing.columns || []).filter(c => c.key !== "viewers" && c.label !== "可见用户" && c.key !== "shipHis" && c.label !== "发货单号记录");
}
function scopedPackRows() {
  if (currentUser.isAdmin) return packing.rows || [];
  return (packing.rows || []).filter(r => rowVisibleTo(r, currentUser.username, packing.columns));
}
const DROPDOWN_LABELS = ["国家", "供应商", "业务员", "跟单员", "数量类型", "品牌"];
let packSelected = new Set();
function sourceRowsForFilters() {
  if (view === "pack") return scopedPackRows();
  if (view === "users") return users.users || [];
  return scopedRows();
}
function distinctOptions(col) {
  const key = col.key === "u_name" ? "name" : col.key;
  const set = new Set();
  sourceRowsForFilters().forEach(r => {
    const v = String(r[key] == null ? "" : r[key]).trim();
    if (v) set.add(v);
  });
  return [...set].sort((a, b) => a.localeCompare(b, "zh"));
}
function isDropdownCol(col) {
  return DROPDOWN_LABELS.includes(col.label);
}
let ctxInfo = null;
let colFilterSel = new Set();
let headerFilterOn = false;
function currentViewCols() {
  if (view === "pack") return packCols();
  if (view === "users") return USER_COLS;
  return showCols();
}
function currentViewRows() {
  if (view === "pack") return scopedPackRows();
  if (view === "users") return users.users || [];
  return scopedRows();
}
function matchFilters(row, cols) {
  return cols.every(col => {
    const v = valOf(row, col.key);
    const picked = filters["__in_" + col.key];
    if (Array.isArray(picked) && picked.length) {
      if (!picked.includes(v)) return false;
    }
    const q = (filters[col.key] || "").trim();
    if (!q) return true;
    if (isDropdownCol(col)) return v === q;
    return v.toLowerCase().includes(q.toLowerCase());
  });
}
function filteredDataRows() {
  return scopedRows().filter(row => matchFilters(row, showCols()));
}
function filteredPackList() {
  return scopedPackRows().filter(row => matchFilters(row, packCols()));
}
function filteredRows() {
  if (view === "pack") return filteredPackList();
  return filteredDataRows();
}
function filterCols() {
  if (view === "pack") {
    const allow = ["发票号", "PO", "HO", "数量类型", "品牌", "供应商", "国家"];
    return packCols().filter(c => allow.includes(c.label));
  }
  return showCols().filter(c => !["createdBy", "createdAt", "updatedBy", "updatedAt"].includes(c.key));
}
function filteredUsers() {
  const qName = (filters.u_name || "").trim().toLowerCase();
  const qUser = (filters.u_username || "").trim().toLowerCase();
  return (users.users || []).filter(u => {
    if (qName && !String(u.name || "").toLowerCase().includes(qName)) return false;
    if (qUser && !String(u.username || "").toLowerCase().includes(qUser)) return false;
    return true;
  });
}
function filterControl(col) {
  const val = filters[col.key] || "";
  if (isDropdownCol(col)) {
    const opts = distinctOptions(col);
    return `<div class="item"><label>${esc(col.label)}</label>
      <select data-key="${col.key}">
        <option value="">请选择</option>
        ${opts.map(o => `<option value="${esc(o)}" ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}
      </select>
    </div>`;
  }
  return `<div class="item"><label>${esc(col.label)}</label>
    <input data-key="${col.key}" placeholder="请输入" value="${esc(val)}" />
  </div>`;
}
function renderFilters() {
  const el = document.getElementById("filters");
  const act = document.getElementById("filterActions");
  if (view === "users") {
    el.innerHTML = filterControl({ key: "u_name", label: "供应商" }) +
      `<div class="item"><label>用户名</label><input data-key="u_username" placeholder="请输入" value="${esc(filters.u_username || "")}" /></div>`;
  } else {
    el.innerHTML = filterCols().map(col => filterControl(col)).join("");
  }
  act.innerHTML = `
    <button type="button" class="btn" id="btnQuery">查询</button>
    <button type="button" class="btn btn-plain" id="btnReset">重置</button>
    <button type="button" class="btn btn-plain" id="btnReload2">刷新</button>
  `;
  el.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") runQuery(); });
  });
  el.querySelectorAll("select").forEach(sel => {
    sel.addEventListener("change", () => { filters[sel.dataset.key] = sel.value; });
  });
  document.getElementById("btnQuery").onclick = runQuery;
  document.getElementById("btnReset").onclick = () => {
    filters = {};
    page = 1;
    renderFilters();
    if (view === "query") renderQuery();
    else if (view === "users") renderUsers();
    else if (view === "pack") renderPack();
    else renderData();
  };
  document.getElementById("btnReload2").onclick = () => {
    if (typeof reloadView === "function") reloadView();
    else location.reload();
  };
}
function runQuery() {
  document.querySelectorAll("#filters input, #filters select").forEach(inp => {
    filters[inp.dataset.key] = inp.value;
  });
  page = 1;
  if (view === "query") renderQuery();
  else if (view === "users") renderUsers();
  else if (view === "pack") renderPack();
  else renderData();
}
function fillPager(elId, total) {
  const el = document.getElementById(elId);
  if (!el) return;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (page > pages) page = pages;
  const start = total ? (page - 1) * pageSize + 1 : 0;
  const end = Math.min(total, page * pageSize);
  const opts = PAGE_SIZES.map(n => `<option value="${n}" ${n===pageSize?"selected":""}>${n}条/页</option>`).join("");
  el.innerHTML = `
    <span>
      <select class="pageSize">${opts}</select>
      共 ${total} 条
    </span>
    <span>
      <button class="pg" data-p="prev" ${page<=1?"disabled":""}>‹</button>
      ${pageButtons(page, pages)}
      <button class="pg" data-p="next" ${page>=pages?"disabled":""}>›</button>
      第 ${start}-${end} 条 / 共 ${total} 条
    </span>
  `;
  el.querySelector(".pageSize").onchange = (e) => {
    pageSize = Number(e.target.value) || 100;
    page = 1;
    if (view === "users") renderUsers();
    else if (view === "query") renderQuery();
    else if (view === "pack") renderPack();
    else renderData();
  };
  el.querySelectorAll(".pg").forEach(btn => {
    btn.onclick = () => {
      if (btn.disabled) return;
      if (btn.dataset.p === "prev") page = Math.max(1, page - 1);
      else if (btn.dataset.p === "next") page = Math.min(pages, page + 1);
      else if (btn.dataset.n) page = Number(btn.dataset.n);
      if (view === "users") renderUsers();
      else if (view === "query") renderQuery();
      else if (view === "pack") renderPack();
      else renderData();
    };
  });
}
function renderQuery() {
  const cols = showCols();
  const table = document.querySelector("#panelQuery table");
  if (!queryWidths.length || queryWidths.length !== cols.length) {
    queryWidths = cols.map(c => defaultWidth(c.label));
  }
  applyColgroup(table, queryWidths);
  document.getElementById("qhead").innerHTML = "<tr>" + cols.map(c => thHtml(c)).join("") + "</tr>";
  const rows = filteredDataRows();
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (page > pages) page = pages;
  const start = (page - 1) * pageSize;
  const slice = rows.slice(start, start + pageSize);
  const empty = document.getElementById("qempty");
  if (!rows.length) {
    document.getElementById("qbody").innerHTML = "";
    empty.hidden = false;
  } else {
    empty.hidden = true;
    document.getElementById("qbody").innerHTML = slice.map(row =>
      "<tr>" + cols.map(c => `<td title="${esc(row[c.key])}">${esc(row[c.key])}</td>`).join("") + "</tr>"
    ).join("");
  }
  enableResize(table, queryWidths);
  enableReorder(table, (from, to) => {
    const colsNow = showCols();
    const next = moveItem(colsNow, from, to);
    const rest = data.columns.filter(c => c.key === "viewers" || c.label === "可见用户");
    data.columns = next.concat(rest);
    queryWidths = moveItem(queryWidths, from, to);
    renderQuery();
  });
  fillPager("qpager", rows.length);
  bindColFilterBtns(table, cols);
  bindTableContext("#panelQuery table", showCols());
}
function isOfficialQty(row) {
  return String(row.qtyType || "").trim() === "正式";
}
function renderPack() {
  const cols = packCols();
  const table = document.querySelector("#panelPack table");
  if (!packWidths.length || packWidths.length !== cols.length + 2) {
    packWidths = [36, 48, ...cols.map(c => defaultWidth(c.label))];
  }
  applyColgroup(table, packWidths);
  const rows = filteredPackList();
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (page > pages) page = pages;
  const start = (page - 1) * pageSize;
  const slice = rows.slice(start, start + pageSize);
  document.getElementById("phead").innerHTML = "<tr>" +
    `<th data-lock="1"><input type="checkbox" class="chk" id="packCheckAll" /></th>` +
    `<th data-lock="1">#</th>` +
    cols.map(c => thHtml(c)).join("") + "</tr>";
  const empty = document.getElementById("pempty");
  if (!rows.length) {
    document.getElementById("pbody").innerHTML = "";
    empty.hidden = false;
  } else {
    empty.hidden = true;
    document.getElementById("pbody").innerHTML = slice.map((row, i) => {
      const n = start + i + 1;
      const id = row.id || ("idx-" + n);
      const checked = packSelected.has(id) ? "checked" : "";
      return "<tr>" +
        `<td class="num"><input type="checkbox" class="chk pack-chk" data-id="${esc(id)}" ${checked} /></td>` +
        `<td class="num">${n}</td>` +
        cols.map(c => `<td title="${esc(row[c.key])}">${esc(row[c.key])}</td>`).join("") +
        "</tr>";
    }).join("");
  }
  enableResize(table, packWidths);
  enableReorder(table, (from, to) => {
    if (from < 2 || to < 2) return;
    packing.columns = moveItem(packCols(), from - 2, to - 2);
    packWidths = moveItem(packWidths, from, to);
    renderPack();
  });
  fillPager("ppager", rows.length);
  bindColFilterBtns(table, cols);
  bindTableContext("#panelPack table", packCols());
  document.querySelectorAll(".pack-chk").forEach(chk => {
    chk.onchange = () => {
      const id = chk.dataset.id;
      if (chk.checked) packSelected.add(id);
      else packSelected.delete(id);
      syncPackCheckAll(rows);
    };
  });
  const all = document.getElementById("packCheckAll");
  if (all) {
    all.onchange = () => {
      if (all.checked) rows.forEach(r => packSelected.add(r.id));
      else rows.forEach(r => packSelected.delete(r.id));
      renderPack();
    };
    syncPackCheckAll(rows);
  }
  const t = packing.fetchedAt || "";
  const el = document.getElementById("packTime");
  if (el) el.textContent = t ? "数据更新时间：" + t : "";
}
function syncPackCheckAll(rows) {
  const all = document.getElementById("packCheckAll");
  if (!all) return;
  const list = rows || filteredPackList();
  const n = list.filter(r => packSelected.has(r.id)).length;
  all.checked = list.length > 0 && n === list.length;
  all.indeterminate = n > 0 && n < list.length;
}
function numVal(v) {
  const s = String(v == null ? "" : v).trim();
  if (!s || s === "-" ) return "";
  const n = Number(s.replace(/,/g, ""));
  return Number.isFinite(n) ? n : s;
}
function cloneCellStyle(from, to) {
  if (!from || !to) return;
  to.style = Object.assign({}, from.style || {});
  if (from.font) to.font = Object.assign({}, from.font);
  if (from.alignment) to.alignment = Object.assign({}, from.alignment);
  if (from.border) to.border = JSON.parse(JSON.stringify(from.border));
  if (from.fill) to.fill = JSON.parse(JSON.stringify(from.fill));
  if (from.numFmt) to.numFmt = from.numFmt;
}
function templateCountry(v) {
  const s = String(v || "").trim();
  if (!s) return "";
  const key = s.split("-")[0].trim().toUpperCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "");
  const drop = {
    ARGENTINA: "ARGENTINA - 阿根廷",
    MEXICO: "MEXICO - 墨西哥",
    CHILE: "CHILE - 智利",
    PERU: "PERÚ - 秘鲁",
    BRAZIL: "BRAZIL - 巴西",
    PARAGUAY: "PARAGUAY - 巴拉圭",
    GUATEMALA: "GUATEMALA - 危地马拉",
    ELSALVADOR: "EL SALVADOR - 萨尔瓦多",
    URUGUAY: "URUGUAY - 乌拉圭",
    ESPANA: "ESPAÑA - 西班牙",
    SPAIN: "ESPAÑA - 西班牙",
    BOLIVIA: "BOLIVIA - 玻利维亚",
  };
  if (drop[key]) return drop[key];
  const hit = Object.keys(drop).find(k => key.includes(k) || k.includes(key));
  return hit ? drop[hit] : s;
}
async function exportPackLabels() {
  const list = filteredPackList();
  const picked = [];
  const bad = [];
  list.forEach((row, i) => {
    if (!packSelected.has(row.id)) return;
    const n = i + 1;
    if (!isOfficialQty(row)) bad.push("第" + n + "行【数量类型】为“" + (row.qtyType || "空") + "”，不允许导出");
    else picked.push(row);
  });
  if (bad.length) { ask(bad.join("；")); return; }
  if (!picked.length) { ask("请先勾选要导出的装箱明细"); return; }
  const countries = [...new Set(picked.map(r => templateCountry(r.country)).filter(Boolean))];
  if (countries.length > 1) {
    ask("勾选的明细包含多个国家，请按同一国家导出");
    return;
  }
  try {
    if (typeof ExcelJS === "undefined") throw new Error("导出组件未加载");
    const res = await fetch("A71-label-template.xlsx?t=" + Date.now());
    if (!res.ok) throw new Error("找不到箱贴模板");
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await res.arrayBuffer());
    const ws = wb.getWorksheet("Template") || wb.worksheets[0];
    const startRow = 17;
    const lastData = startRow + picked.length - 1;
    const srcRow = ws.getRow(startRow);
    const headerFill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0070C0" } };
    const headerFont = { name: "Calibri", color: { argb: "FFFFFFFF" }, bold: true };
    const dataFill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFFFFF" } };
    const dataFont = { color: { argb: "FF000000" } };
    for (let c = 2; c <= 24; c++) {
      const cell = ws.getRow(16).getCell(c);
      cell.fill = headerFill;
      if (cell.font) cell.font = Object.assign({}, cell.font, headerFont);
      else cell.font = headerFont;
    }
    for (let r = startRow + 1; r <= Math.max(lastData, 22); r++) {
      for (let c = 2; c <= 24; c++) cloneCellStyle(srcRow.getCell(c), ws.getRow(r).getCell(c));
    }

    if (found.key !== col.key) {

      (data.rows || []).forEach(r => {
        const oldVal = r[oldKey];
        if ((r[col.key] == null || r[col.key] === "") && oldVal != null && oldVal !== "") r[col.key] = oldVal;
        if (oldKey !== col.key) delete r[oldKey];

    const parts = splitSuppliers(r[key]);

      if (parts[0]) {
        r[key] = parts[0];
        const code = supplierCodeOf(parts[0]);
        if (code) r.viewers = code.toLowerCase();

const COUNTRY_EN = {
  "玻利维亚": "BOLIVIA", "巴西": "BRAZIL", "巴拉圭": "PARAGUAY", "乌拉圭": "URUGUAY",
  "危地马拉": "GUATEMALA", "萨尔瓦多": "EL SALVADOR", "秘鲁": "PERU", "智利": "CHILE",
  "阿根廷": "ARGENTINA", "墨西哥": "MEXICO"
};

function formatCountry(v) {
  const s = String(v || "").trim();
  if (!s) return "";
  if (s.includes("-")) {
    const i = s.indexOf("-");
    const left = s.slice(0, i).trim();
    const right = s.slice(i + 1).trim();
    if (/[A-Za-z]/.test(left) && /[一-鿿]/.test(right)) return left.toUpperCase() + " - " + right;
    if (/[一-鿿]/.test(left) && /[A-Za-z]/.test(right)) return right.toUpperCase() + " - " + left;
  }
  if (COUNTRY_EN[s]) return COUNTRY_EN[s] + " - " + s;
  const up = s.toUpperCase();
  if (COUNTRY_CN[up]) return up + " - " + COUNTRY_CN[up];
  return s;
}
function splitSuppliers(v) {

    <div class="item"><label>${esc(c.label)}${isRequired(c.label) ? ' <span style="color:#ef4444">*</span>' : ""}</label><input data-key="${c.key}" value="${esc(row[c.key] || "")}" /></div>
  `).join("");
  document.getElementById("modal").classList.add("on");
}
function ask(text, onOk) {
  document.getElementById("dlgText").textContent = text;
  document.getElementById("dlgCancel").style.display = onOk ? "" : "none";
  document.getElementById("dlg").classList.add("on");
  const close = () => document.getElementById("dlg").classList.remove("on");
  document.getElementById("dlgOk").onclick = () => { close(); if (onOk) onOk(); };
  document.getElementById("dlgCancel").onclick = close;
  document.getElementById("dlgX").onclick = close;
}
document.getElementById("modalCancel").onclick = () => document.getElementById("modal").classList.remove("on");
document.getElementById("modalX").onclick = () => document.getElementById("modal").classList.remove("on");
document.getElementById("modalOk").onclick = () => {
  if (modalKind === "user") {
    const rec = {
      username: document.getElementById("f_username").value.trim().toUpperCase(),
      name: document.getElementById("f_name").value.trim(),
      password: document.getElementById("f_password").value.trim().toUpperCase(),
    };
    const who = operatorName();
    const t = nowText();
    if (modalIndex < 0) {
      rec.createdBy = who;
      rec.createdAt = t;
      rec.updatedBy = who;
      rec.updatedAt = t;
      users.users.unshift(rec);
      page = 1;
    } else {
      rec.createdBy = users.users[modalIndex].createdBy || who;
      rec.createdAt = users.users[modalIndex].createdAt || t;
      rec.updatedBy = who;
      rec.updatedAt = t;
      users.users[modalIndex] = rec;
    }
    renderUsers();
  } else {
    const rec = modalIndex < 0 ? { id: uid() } : { ...data.rows[modalIndex] };
    document.querySelectorAll("#modalForm input").forEach(inp => {
      if (!["createdBy", "createdAt", "updatedBy", "updatedAt"].includes(inp.dataset.key)) rec[inp.dataset.key] = inp.value;
    });
    applyCountryFormat(rec);
    const supKey = fieldByLabel("供应商");
    const parts = splitSuppliers(rec[supKey]);
    if (parts.length > 1) {
      rec[supKey] = parts[0];
      rec.viewers = (supplierCodeOf(parts[0]) || rec.viewers || "").toLowerCase();
    } else if (parts.length === 1) {
      rec[supKey] = parts[0];
      rec.viewers = (supplierCodeOf(parts[0]) || rec.viewers || "").toLowerCase();
    }
    const miss = missingRequired(rec);
    if (miss.length) {
      ask("请填写必填项：" + miss.map(c => c.label).join("、"));
      return;
    }
    const extras = parts.slice(1).map((part, i) => {
      const nr = { ...rec, id: uid() + "-" + (i + 1) };
      nr[supKey] = part;
      nr.viewers = (supplierCodeOf(part) || "").toLowerCase();
      return nr;
    });
    const checkList = [rec, ...extras];
    for (const one of checkList) {
      const skip = modalIndex < 0 || one !== rec ? -1 : modalIndex;
      if (isDuplicate(one, skip)) {
        ask("PO、HO、发票号已存在，不能重复新增");
        return;
      }
    }
    const who = operatorName();
    const t = nowText();
    if (modalIndex < 0) {
      rec.createdBy = who;
      rec.createdAt = t;
      rec.updatedBy = who;
      rec.updatedAt = t;
      extras.forEach(nr => {
        nr.createdBy = who; nr.createdAt = t; nr.updatedBy = who; nr.updatedAt = t;
      });
      data.rows.unshift(rec, ...extras);
      page = 1;
    } else {
      rec.createdBy = rec.createdBy || who;
      rec.createdAt = rec.createdAt || t;
      rec.updatedBy = who;
      rec.updatedAt = t;
      extras.forEach(nr => {
        nr.createdBy = rec.createdBy; nr.createdAt = rec.createdAt; nr.updatedBy = who; nr.updatedAt = t;
      });
      data.rows.splice(modalIndex, 1, rec, ...extras);
    }
    renderData();
  }
  document.getElementById("modal").classList.remove("on");
  publishVault();
  renderFilters();
};
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById("navUsers").onclick = (e) => { e.preventDefault(); setView("users"); };
document.getElementById("navData").onclick = (e) => { e.preventDefault(); setView("data"); };
document.getElementById("navPack").onclick = (e) => { e.preventDefault(); setView("pack"); };
document.getElementById("navQuery").onclick = (e) => { e.preventDefault(); setView("query"); };
function reloadView() {
  try {
    const savedData = JSON.parse(localStorage.getItem("invoice.data") || "null");
    if (savedData && savedData.rows) data = savedData;
  } catch (e) {}
  try {
    const savedUsers = JSON.parse(localStorage.getItem("invoice.users") || "null");
    if (savedUsers && savedUsers.users) users = normalizeUsers(savedUsers);
  } catch (e) {}
  try {
    const savedPack = JSON.parse(localStorage.getItem("invoice.packing") || "null");
    if (savedPack && savedPack.rows) packing = savedPack;
  } catch (e) {}
  if (!packing.columns) packing.columns = [];
  if (!packing.rows) packing.rows = [];
  fillUserAudit();
  fillAuditFields();
  page = 1;
  renderUsers();
  renderData();
  renderPack();
  renderQuery();
  renderFilters();
  show("已刷新");
  setTimeout(() => { document.getElementById("msg").style.display = "none"; }, 1200);
}
function afterLogin() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "grid";
  document.getElementById("who").innerHTML =
    (currentUser.name || currentUser.username) +
    '　<button type="button" class="btn btn-text" id="btnReload">刷新</button>' +
    '　<button type="button" class="btn btn-text" id="btnOut">退出</button>';
  document.getElementById("btnReload").onclick = reloadView;
  document.getElementById("btnOut").onclick = () => {
    clearSession();
    location.reload();
  };
  document.getElementById("navUsers").style.display = currentUser.isAdmin ? "" : "none";
  document.getElementById("navData").style.display = currentUser.isAdmin ? "" : "none";
  document.getElementById("navPack").style.display = "";
  document.getElementById("navQuery").style.display = "";
  setView("query");
  touchSession();
  if (!idleBound) {
    idleBound = true;
    ["click", "keydown", "mousemove", "scroll"].forEach(ev => {
      document.addEventListener(ev, touchSession, { passive: true });
    });
  }
}
async function loadUserPack(username) {
  const uname = String(username || "").trim().toUpperCase();
  const r = await fetch("vault/" + encodeURIComponent(uname) + ".json?t=" + Date.now());
  if (!r.ok) throw new Error("账号不存在");
  return r.json();
}
async function tryLogin(fromSaved) {
  const err = document.getElementById("loginErr");
  err.textContent = "";
  const username = document.getElementById("loginUser").value.trim().toUpperCase();
  const password = document.getElementById("loginPass").value.trim();
  document.getElementById("loginUser").value = username;
  if (!username) { err.textContent = "请输入用户名"; return; }
  if (!password) { err.textContent = "请输入密码"; return; }
  try {
    const pack = await loadUserPack(username);
    const payload = await unlockPack(pack, password);
    currentUser = {
      username: payload.username,
      name: payload.name || payload.username,
      isAdmin: !!payload.isAdmin || isAdminUser(payload.username),
    };
    data.columns = payload.columns || data.columns;
    data.rows = payload.rows || [];
    packing.columns = payload.packingColumns || packing.columns || [];
    packing.rows = payload.packingRows || packing.rows || [];
    packing.fetchedAt = payload.packingFetchedAt || packing.fetchedAt || "";
    if (payload.users) users = { users: payload.users };
    fillUserAudit();
    fillAuditFields();
    saveSession(username, password);
    afterLogin();
  } catch (e) {
    if (fromSaved) {
      clearSession();
      document.getElementById("loginBox").style.display = "";
      document.getElementById("app").style.display = "none";
    }
    err.textContent = e.message || "登录失败";
  }
}
document.getElementById("btnLogin").onclick = () => tryLogin(false);
document.getElementById("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(false); });
function restoreSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  try {
    const saved = readSession();
    if (!saved || !saved.username) return;
    document.getElementById("loginUser").value = saved.username;
    document.getElementById("loginPass").value = saved.password || "";
    tryLogin(true);
  } catch (e) {}
}
function normalizeUsers(u) {
  const list = (u && u.users) || [];
  return {
    users: list.map(x => {
      const username = String(x.username || "").trim().toUpperCase();
      return {
        username,
        name: x.name || "",
        password: String(x.password || "").trim().toUpperCase(),
        createdBy: x.createdBy || username,
        createdAt: x.createdAt || "",
        updatedBy: x.updatedBy || username,
        updatedAt: x.updatedAt || "",
      };
    }),
  };
}
Promise.all([
  fetch("data.json").then(r => r.ok ? r.json() : { columns: [], rows: [] }).catch(() => ({ columns: [], rows: [] })),
  fetch("users.json").then(r => r.ok ? r.json() : { users: [] }).catch(() => ({ users: [] })),
]).then(([d, u]) => {
  try {
    const savedData = JSON.parse(localStorage.getItem("invoice.data") || "null");
    data = savedData && savedData.rows ? savedData : d;
  } catch (e) { data = d; }
  try {
    const savedUsers = JSON.parse(localStorage.getItem("invoice.users") || "null");
    users = normalizeUsers(savedUsers && savedUsers.users ? savedUsers : u);
  } catch (e) { users = normalizeUsers(u); }
  if (!data.columns) data.columns = [];
  if (!data.rows) data.rows = [];
  fillUserAudit();
  fillAuditFields();
  restoreSession();
}).catch(() => restoreSession());
</script>
